<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מד מצב רוח</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }

        .container {
            display: flex;
            align-items: flex-end;
            gap: 50px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* עיצוב המבחנה */
        .test-tube {
            width: 50px;
            height: 200px;
            border: 4px solid #333;
            border-top: none;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            position: relative;
            overflow: hidden;
            background: #eee;
        }

        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            /* ברירת מחדל */
            background: linear-gradient(to top, #ff416c, #ff4b2b);
            transition: height 0.3s ease, background 0.5s ease;
        }

        /* עיצוב הסליידר (המד) */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        input[type=range] {
            writing-mode: bt-lr;
            /* לשינוי כיוון בדפדפנים תומכים */
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 200px;
            padding: 0 5px;
        }

        #emoji {
            font-size: 50px;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        /* כפתור סודי */
        .secret-area {
            margin-top: 20px;
            text-align: center;
        }

        #secret-btn {
            background: none;
            border: 1px solid #ccc;
            color: #ccc;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        #secret-btn:hover {
            color: #666;
            border-color: #666;
        }

        #value-display {
            display: none;
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

    <div id="emoji">😐</div>

    <div class="container">
        <!-- מבחנה -->
        <div class="test-tube">
            <div id="liquid" class="liquid"></div>
        </div>

        <!-- מד (Slider) -->
        <div class="controls">
            <input type="range" id="meter" min="0" max="10" step="0.1" value="5">
        </div>
    </div>

    <div class="secret-area">
        <button id="secret-btn">כפתור סודי</button>
        <div id="value-display"><span id="current-val">5</span>/10</div>
    </div>

    <script>
        const meter = document.getElementById('meter');
        const liquid = document.getElementById('liquid');
        const emoji = document.getElementById('emoji');
        const currentValText = document.getElementById('current-val');
        const secretBtn = document.getElementById('secret-btn');
        const valueDisplay = document.getElementById('value-display');

        meter.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);

            // עדכון גובה הנוזל במבחנה
            liquid.style.height = (val * 10) + '%';

            // עדכון ערך מספרי (נסתר)
            currentValText.textContent = val.toFixed(1);

            // לוגיקת סמיילי וצבע
            if (val > 7) {
                emoji.textContent = '😊';
                liquid.style.background = 'linear-gradient(to top, #00b09b, #96c93d)'; // ירוק
            } else if (val < 3) {
                emoji.textContent = '😢';
                liquid.style.background = 'linear-gradient(to top, #cb2d3e, #ef473a)'; // אדום
            } else {
                emoji.textContent = '😐';
                liquid.style.background = 'linear-gradient(to top, #ff416c, #ff4b2b)'; // כתום/ורוד
            }
        });

        // הצגת הערך הסודי
        secretBtn.addEventListener('click', () => {
            if (valueDisplay.style.display === 'block') {
                valueDisplay.style.display = 'none';
            } else {
                valueDisplay.style.display = 'block';
            }
        });
    </script>
</body>

</html>
