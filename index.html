<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מד הזדהות</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
            overflow: hidden;
            /* מניעת בחירת טקסט בטעות בזמן גרירה */
            user-select: none;
            -webkit-user-select: none;
        }

        .emoji-container {
            position: relative;
            margin-bottom: 30px;
        }

        #emoji {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pop {
            transform: scale(1.3) rotate(5deg);
        }

        #value-display {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, transform 0.3s ease;
            white-space: nowrap;
            pointer-events: none;
        }

        #value-display.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -10px);
        }

        .container {
            background: white;
            padding: 50px 80px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .test-tube {
            width: 80px;
            height: 300px;
            border: 6px solid #2c3e50;
            border-top: none;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            position: relative;
            overflow: hidden;
            background: #e8ecf1;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
            cursor: ns-resize; /* סמן גרירה אנכי */
            touch-action: none; /* מניעת גלילת מסך במובייל בזמן נגיעה במבחנה */
        }

        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, #ff416c, #ff4b2b);
            transition: background 0.2s ease-out, box-shadow 0.2s ease-out;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            pointer-events: none; /* מבטיח שהאירועים יקלטו על המבחנה עצמה */
        }
    </style>
</head>
<body>

    <div class="emoji-container">
        <div id="value-display"><span id="current-val">5.0</span> / 10</div>
        <div id="emoji">😐</div>
    </div>

    <div class="container">
        <div class="test-tube" id="test-tube">
            <div id="liquid" class="liquid"></div>
        </div>
    </div>

    <script>
        const testTube = document.getElementById('test-tube');
        const liquid = document.getElementById('liquid');
        const emoji = document.getElementById('emoji');
        const currentValText = document.getElementById('current-val');
        const valueDisplay = document.getElementById('value-display');

        let currentMood = 'neutral';
        let isDragging = false;

        // פונקציה לעדכון גובה המבחנה לפי מיקום העכבר/מגע
        function updateLevel(clientY) {
            const rect = testTube.getBoundingClientRect();
            // חישוב המיקום היחסי (0 למעלה, 1 למטה)
            let percentage = 1 - ((clientY - rect.top) / rect.height);
            
            // הגבלת הגבולות בין 0 ל-100 אחוז
            if (percentage < 0) percentage = 0;
            if (percentage > 1) percentage = 1;

            const val = percentage * 10;
            
            liquid.style.height = `${percentage * 100}%`;
            currentValText.textContent = val.toFixed(1);

            let newMood, newEmoji, newColor;

            if (val > 7) {
                newMood = 'agree';
                newEmoji = '🤩'; // מסכים / מזדהה
                newColor = 'linear-gradient(to top, #00b09b, #96c93d)';
            } else if (val < 3) {
                newMood = 'disagree';
                newEmoji = '😒'; // לא מסכים
                newColor = 'linear-gradient(to top, #cb2d3e, #ef473a)';
            } else {
                newMood = 'neutral';
                newEmoji = '😐'; // ניטרלי
                newColor = 'linear-gradient(to top, #ff416c, #ff4b2b)';
            }

            liquid.style.background = newColor;

            if (currentMood !== newMood) {
                emoji.classList.add('pop');
                setTimeout(() => {
                    emoji.textContent = newEmoji;
                    setTimeout(() => emoji.classList.remove('pop'), 100);
                }, 100);
                currentMood = newMood;
            }
        }

        // אירועי עכבר
        testTube.addEventListener('mousedown', (e) => {
            isDragging = true;
            updateLevel(e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            updateLevel(e.clientY);
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // אירועי מגע (למובייל)
        testTube.addEventListener('touchstart', (e) => {
            isDragging = true;
            updateLevel(e.touches[0].clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            updateLevel(e.touches[0].clientY);
            e.preventDefault(); // מניעת גלילה נוספת
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        // כפתור סודי: לחיצה כפולה על הסמיילי
        emoji.addEventListener('dblclick', () => {
            valueDisplay.classList.toggle('show');
        });
    </script>
</body>
</html>
